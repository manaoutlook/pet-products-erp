# SmartERP - nginx reverse proxy for the Node app.
#
# Install (docs/PRODUCTION_SERVER.md, Step 9):
#   sudo cp deploy/nginx-smart-erp.conf /etc/nginx/sites-available/smart-erp
#   sudo ln -sf /etc/nginx/sites-available/smart-erp /etc/nginx/sites-enabled/smart-erp
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.smartlife-vn.com --redirect
#
# server_name below is erp.smartlife-vn.com, whose A record must point at
# 103.126.162.131 before running certbot. If the hostname ever changes, change it
# here and in the certbot command together, then `nginx -t && systemctl reload nginx`.

upstream smart_erp_app {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.smartlife-vn.com;

    # Bulk product import posts up to 10 MB of JSON (server/index.ts express.json).
    client_max_body_size 12m;

    access_log /var/log/nginx/smart-erp.access.log;
    error_log  /var/log/nginx/smart-erp.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Vite emits content-hashed files under /assets, so they can be cached hard.
    location /assets/ {
        proxy_pass http://smart_erp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # One Cache-Control header only - `expires` would add a second one.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # /uploads/... is served by Express from /opt/SmartERP/uploads, with a 7 day
    # maxAge of its own - do not add another cache layer here.
    location / {
        proxy_pass http://smart_erp_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Invoice/DN archive generation and bulk imports can take a while.
        proxy_read_timeout 120s;
    }
}
